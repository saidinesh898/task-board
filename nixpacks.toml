# Dokploy defaults to Nixpacks unless Dockerfile is selected explicitly.
# Keep this fallback on the same supported runtime as the production Dockerfile.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["TASK_BOARD_BUILD_TARGET=standalone npm run build:next"]

[start]
cmd = "npm run start"
